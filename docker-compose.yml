services:
  inference:
    build:
      context: ./inference
      args:
        VARIANT: cpu
        BASE_IMAGE: python:3.11-slim
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/root/.cache
  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      - INFERENCE_URL=http://inference:8000
      - PORT=3001
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      - inference

volumes:
  model-cache:
